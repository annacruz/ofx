name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # coverage comment (see .github/scripts/coverage_comment.rb)

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.1', '3.2', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run Tests
        run: bundle exec rspec --format progress --format json --out coverage/rspec.json
      - name: Comment uncovered code on the pull request
        if: always() && github.event_name == 'pull_request' && matrix.ruby-version == '3.4'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr="${{ github.event.pull_request.number }}"
          set +e
          ruby .github/scripts/coverage_comment.rb > coverage/comment.md
          status=$?
          set -e
          case "$status" in
            10) # uncovered code: post the report
              gh pr comment "$pr" --body-file coverage/comment.md ;;
            0)  # full coverage: say so only if the last bot comment reported a gap
              last=$(gh api "repos/${{ github.repository }}/issues/$pr/comments" --paginate \
                --jq '[.[] | select(.user.login == "github-actions[bot]") | .body] | last // ""')
              if [[ "$last" == *"<!-- simplecov-report -->"* ]]; then
                printf '<!-- simplecov-restored -->\n## Test coverage\n\nBack to 100%% of lines and branches.\n' > coverage/comment.md
                gh pr comment "$pr" --body-file coverage/comment.md
              fi ;;
            11) echo "coverage not meaningful for this run, no comment" ;;
            *)  exit "$status" ;;
          esac
      - name: Run RuboCop
        run: bundle exec rubocop
