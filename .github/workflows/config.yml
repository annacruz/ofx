name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # coverage comment (see .github/scripts/coverage_comment.rb)

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.1', '3.2', '3.3', '3.4']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run Tests
        run: bundle exec rspec --format progress --format json --out coverage/rspec.json
      - name: Comment uncovered code on the pull request
        if: always() && github.event_name == 'pull_request' && matrix.ruby-version == '3.4'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ruby .github/scripts/coverage_comment.rb > coverage/comment.md && exit 0
          [ $? -eq 10 ] || exit 1
          gh pr comment "${{ github.event.pull_request.number }}" --body-file coverage/comment.md
      - name: Run RuboCop
        run: bundle exec rubocop
